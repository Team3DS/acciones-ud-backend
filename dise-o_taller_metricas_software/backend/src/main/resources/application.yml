spring:
  application:
    name: gfc-backend

  datasource:
    url: jdbc:h2:file:./data/gfcdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

gfc:
  jwt:
    secret: "cambia-este-secreto-en-produccion-taller-metricas-gfc-2026"
    expiracion-minutos: 60
  cors:
    allowed-origins: http://localhost:4321
  seed:
    empleado:
      usuario: empleado
      clave: empleado123
    cliente:
      usuario: cliente
      clave: cliente123
      nombre: Cliente Demo
      documento: "1023000001"
      email: cliente@demo.com
    empresa:
      usuario: empresa
      clave: empresa123
      nombre: Empresa Demo S.A.S.
      documento: "901000001"
      email: empresa@demo.com
