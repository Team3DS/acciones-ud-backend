spring:
  application:
    name: m4-datos-mercado
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_db}
    username: ${DB_USER:acciones_ud}
    password: ${DB_PASSWORD:acciones_ud}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${M4_MIGRATION_USER:${DB_USER:acciones_ud}}
    password: ${M4_MIGRATION_PASSWORD:${DB_PASSWORD:acciones_ud}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:acciones_ud}
    password: ${RABBITMQ_PASSWORD:acciones_ud}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  jwt:
    secret: ${JWT_SECRET}
  catalog:
    base-url: ${CATALOG_BASE_URL:http://m3-catalogo-mercados:8083}
  alpaca:
    api-key: ${ALPACA_API_KEY}
    api-secret: ${ALPACA_API_SECRET}
    base-url: ${ALPACA_BASE_URL:https://paper-api.alpaca.markets}
  market:
    update-interval: 1000