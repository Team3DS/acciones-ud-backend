spring:
  application:
    name: m4-datos-mercado
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mercado_db}
    username: ${DB_USER:acciones_ud}
    password: ${DB_PASSWORD:acciones_ud}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:acciones_ud}
    password: ${RABBITMQ_PASSWORD:acciones_ud}

server:
  port: ${SERVER_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  # Datos de mercado de Alpaca (https://data.alpaca.markets). Con las claves vacías M4 arranca igual,
  # pero las consultas fallan y el circuito de Resilience4j responde con error.
  alpaca:
    base-url: ${ALPACA_DATA_URL:https://data.alpaca.markets}
    api-key: ${ALPACA_API_KEY:}
    api-secret: ${ALPACA_API_SECRET:}
    data-feed: ${ALPACA_DATA_FEED:iex}
    timeout-seconds: ${ALPACA_TIMEOUT_SECONDS:5}
  # Mismo secreto que firma M1; valida los tokens de los usuarios y firma el de sistema hacia M3.
  jwt:
    secret: ${JWT_SECRET}
  m3:
    base-url: ${M3_BASE_URL:http://m3-catalogo-mercados:8083}
    timeout-ms: ${M3_TIMEOUT_MS:3000}
  websocket:
    endpoint: /market/ws/quotes
    heartbeat-interval: 30000
  cache:
    quote-ttl-seconds: 30
    snapshot-ttl-seconds: 300
