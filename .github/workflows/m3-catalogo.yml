name: M3 Catalogo

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'm3-catalogo-mercados/**'
      - '.github/workflows/m3-catalogo.yml'
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'm3-catalogo-mercados/**'
      - '.github/workflows/m3-catalogo.yml'

permissions:
  contents: read

jobs:
  verify-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unitarias e integracion PostgreSQL
        run: mvn -B -pl m3-catalogo-mercados -am -Pintegration,quality verify -Dm3.test.rabbit=true -Dm3.excluded-groups=
      - name: Construir imagen M3
        run: docker build -f m3-catalogo-mercados/Dockerfile -t acciones-ud/m3:ci .
