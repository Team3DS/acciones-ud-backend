name: M3 Catalogo

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'm3-catalogo-mercados/**'
      - '.github/workflows/m3-catalogo.yml'
  push:
    branches: [main, feat/m3-catalogo-mercados]
    paths:
      - 'pom.xml'
      - 'm3-catalogo-mercados/**'
      - '.github/workflows/m3-catalogo.yml'

permissions:
  contents: read

jobs:
  verify-m3:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Unitarias e integracion PostgreSQL
        run: mvn -B -pl m3-catalogo-mercados -am -Pintegration,quality verify -Dm3.test.rabbit=true -Dm3.excluded-groups=
      - name: Construir imagen M3
        if: matrix.java == '21'
        run: docker build -f m3-catalogo-mercados/Dockerfile -t acciones-ud/m3:ci .
