name: CI Backend - Trunk Based

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests
        run: mvn -B verify -DskipTests=false -DfailIfNoTests=false

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=dev

      - name: Build and push all services
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}-${{ matrix.service }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        strategy:
          fail-fast: false
          matrix:
            service:
              - gateway
              - m1-identidad
              - m2-cuentas-fondos
              - m3-catalogo-mercados
              - m4-datos-mercado
              - m5-ordenes-ejecucion
              - m6-portafolio
              - m8-notificaciones
              - m10-suscripciones-pagos

  promote:
    name: Promote to Production
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Pull and re-tag dev images to production
        run: |
          for svc in gateway m1-identidad m2-cuentas-fondos m3-catalogo-mercados m4-datos-mercado m5-ordenes-ejecucion m6-portafolio m8-notificaciones m10-suscripciones-pagos; do
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${svc}:dev
            docker tag ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${svc}:dev ${{ steps.meta.outputs.tags }}-${svc}
            docker push ${{ steps.meta.outputs.tags }}-${svc}
          done